# Status of every META component. This file is the source of truth: `meta info`
# embeds it and scripts/check-docs.py requires README.md to agree with it.
#
# Labels: IMPLEMENTED, EXPERIMENTAL, IN DEVELOPMENT, PLANNED, RESEARCH REQUIRED

[[component]]
id = "cli"
name = "meta CLI"
status = "IMPLEMENTED"
summary = "Version, platform, hardware, network and compatibility reports"

[[component]]
id = "linux2bsd"
name = "linux2BSD"
status = "EXPERIMENTAL"
summary = "Checks Linux programs and runs them through Linuxulator or an edition's jail"

[[component]]
id = "editions"
name = "Editions"
status = "EXPERIMENTAL"
summary = "Debian and Arch roots: created from signed archives, run, updated, rolled back, removed"

[[component]]
id = "metaupd"
name = "metaupd"
status = "EXPERIMENTAL"
summary = "Verifies, downloads and installs signed releases into boot environments; rolls back"

[[component]]
id = "metaupd-dbus"
name = "metaupd D-Bus"
status = "EXPERIMENTAL"
summary = "Update service for desktops, authorized by polkit"

[[component]]
id = "desktop-updates"
name = "Desktop updates"
status = "EXPERIMENTAL"
summary = "META Update Manager, tested in XFCE; no Discover or GNOME Software plugin"

[[component]]
id = "release-tool"
name = "metaupd-release"
status = "EXPERIMENTAL"
summary = "Generates, signs and verifies release metadata"

[[component]]
id = "installer"
name = "meta-installer"
status = "EXPERIMENTAL"
summary = "Installs on a whole disk with ZFS; no UFS, encryption or custom partitioning"

[[component]]
id = "iso"
name = "Installation media"
status = "EXPERIMENTAL"
summary = "Build script for a BIOS and UEFI image that installs without a network"

[[component]]
id = "eds"
name = "EDS"
status = "EXPERIMENTAL"
summary = "Detects hardware, weighs evidence about drivers, plans and carries out changes; no physical hardware tested"

[[component]]
id = "mlce"
name = "Linux machines"
status = "EXPERIMENTAL"
summary = "Debian and Arch with their own kernel under bhyve, unprivileged; Debian 12 verified in a nested virtual machine"

[[component]]
id = "maes"
name = "Adaptive execution"
status = "EXPERIMENTAL"
summary = "Finds out what a program needs and runs it in the least demanding runtime that has it"

[[component]]
id = "network"
name = "META Network"
status = "EXPERIMENTAL"
summary = "NetworkManager-compatible service for wired networks; no Wi-Fi or VPN"

[[component]]
id = "kernel"
name = "Kernel build"
status = "EXPERIMENTAL"
summary = "FreeBSD GENERIC with a META identity, from a pinned source, as a package"

[[component]]
id = "native-packages"
name = "Native packages"
status = "EXPERIMENTAL"
summary = "META packages and a signed repository; none is published"

[[component]]
id = "package-policy"
name = "Package policy"
status = "EXPERIMENTAL"
summary = "Isolation and override rules as tested code; not connected to pkg"

[[component]]
id = "desktops"
name = "Desktops"
status = "EXPERIMENTAL"
summary = "XFCE installed and used in a virtual machine; the others are untested"

[[component]]
id = "jails"
name = "Containers"
status = "EXPERIMENTAL"
summary = "Compatibility roots run as jails; no general container support"

[[component]]
id = "linuxkpi"
name = "LinuxKPI"
status = "RESEARCH REQUIRED"
summary = "Gap analysis tool and one driver family analyzed; no driver work"

[[component]]
id = "bootloader"
name = "GRUB"
status = "RESEARCH REQUIRED"
summary = "FreeBSD's loader is used until GRUB is validated"

[[component]]
id = "coreutils"
name = "Core utilities"
status = "PLANNED"
summary = "FreeBSD base utilities; no replacements written"
