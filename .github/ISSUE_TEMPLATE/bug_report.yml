name: Bug report
description: Something implemented does not work
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands and their output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `meta info` and, on FreeBSD, `meta doctor`.
      render: shell
    validations:
      required: true
