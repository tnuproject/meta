# META Arch Edition. See docs/packaging/editions.md.
id = "arch"
name = "META Arch Edition"
ecosystem = "arch"
root = "/compat/meta/arch"
package_manager = "pacman"
package_format = "pkg.tar.zst"

# The fingerprint is the one published on https://archlinux.org/download/ and the
# one Arch's web key directory serves for the signer, checked on 2026-11-25.
[bootstrap]
kind = "archive"
url = "https://geo.mirror.pkgbuild.com/iso/latest/archlinux-bootstrap-x86_64.tar.zst"
signature = "https://geo.mirror.pkgbuild.com/iso/latest/archlinux-bootstrap-x86_64.tar.zst.sig"
signer = "pierre@archlinux.org"
fingerprint = "3E80CA1A8B89F69CBA57D98A76A5EF9054449A5C"

[[shared]]
host = "/home"
inside = "/home"
writable = true
reason = "user data"

[[shared]]
host = "/tmp"
inside = "/tmp"
writable = true
reason = "sockets and temporary files shared with native programs"

[[shared]]
host = "/var/run/dbus"
inside = "/run/dbus"
writable = false
reason = "the system bus; every service on it authorizes its callers"
