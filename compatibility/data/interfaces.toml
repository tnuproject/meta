# Kernel interfaces and environments: which runtime provides them, and how that is
# known. System calls are in linuxulator-*.toml, generated from FreeBSD's source.
#
# "userspace" is a managed Linux userland. Its kernel is FreeBSD's, so it provides
# no kernel interface that Linuxulator lacks.
schema = 1

[[interface]]
requirement = "kernel:namespaces"
summary = "Linux namespaces"
provision = { native = "missing", linuxulator = "missing", userspace = "missing", virtual-machine = "provided" }
evidence = [
    { source = "source-code", detail = "unshare and setns are placeholders, and clone has no namespace flags", reference = "FreeBSD 15.1 sys/compat/linux/linux_dummy.c" },
    { source = "test", detail = "unshare fails with ENOSYS under Linuxulator and works in a Debian guest", reference = "tests/vm/guest/mlce-requirements.sh" },
]

[[interface]]
requirement = "kernel:cgroup-v1"
summary = "Control groups, version 1"
provision = { native = "missing", linuxulator = "missing", userspace = "missing", virtual-machine = "configurable" }
evidence = [
    { source = "source-code", detail = "no cgroup filesystem exists in FreeBSD", reference = "FreeBSD 15.1 sys/compat, sys/fs" },
    { source = "documentation", detail = "needs a guest whose init system still supports version 1", reference = "https://www.freedesktop.org/software/systemd/man/252/systemd.html" },
]

